<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARFILM — Dashboard</title>

  <!-- FAVICON -->
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/static/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #000000;
      --surface: #0d0c0a;
      --card: #111008;
      --card2: #161410;
      --gold: #c9a87c;
      --gold-lt: #dfc49c;
      --gold-dk: #a07d52;
      --gold-dim: rgba(201, 168, 124, 0.10);
      --gold-bdr: rgba(201, 168, 124, 0.20);
      --text: #f0ead8;
      --muted: #7a6e5a;
      --error: #c97c7c;
      --radius: 4px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.3;
    }

    .ambient {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.06;
    }

    .a1 {
      width: 500px;
      height: 500px;
      background: var(--gold);
      top: -150px;
      right: -100px;
    }

    .a2 {
      width: 350px;
      height: 350px;
      background: var(--gold-dk);
      bottom: -80px;
      left: -80px;
    }

    /* ── TOP NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(201, 168, 124, 0.12);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }

    .nav-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      padding: 5px 14px;
      background: transparent;
      border: 1px solid rgba(201, 168, 124, 0.22);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: color .2s, border-color .2s;
    }

    .nav-btn:hover {
      color: var(--gold);
      border-color: rgba(201, 168, 124, 0.5);
    }

    .nav-btn.danger:hover {
      color: var(--error);
      border-color: rgba(201, 124, 124, 0.4);
    }

    /* ── LAYOUT ── */
    .page {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
      padding: 76px 20px 0;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 32px 0 28px;
      border-bottom: 1px solid var(--gold-bdr);
      margin-bottom: 28px;
    }

    .page-header-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .page-title-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-dk);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .page-title span {
      color: var(--gold);
    }

    /* ── STAT CARDS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    @media(max-width:560px) {
      .stats-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--gold-bdr);
      border-radius: var(--radius);
      padding: 20px 20px 18px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold-dk), var(--gold-lt));
    }

    .stat-label {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 300;
    }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold-dk);
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold-bdr);
    }

    /* ── TWO COL LAYOUT ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    @media(max-width:640px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    /* ── PANEL CARD ── */
    .panel {
      background: var(--card);
      border: 1px solid var(--gold-bdr);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
    }

    .panel::before,
    .panel::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--gold-dk);
      border-style: solid;
    }

    .panel::before {
      top: -1px;
      left: -1px;
      border-width: 1px 0 0 1px;
    }

    .panel::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 1px 1px 0;
    }

    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-lt);
      letter-spacing: 0.06em;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gold-bdr);
    }

    /* ── ACCOUNT INFO ── */
    .info-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 0;
    }

    .info-item {}

    .info-lbl {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 3px;
    }

    .info-val {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 300;
    }

    /* ── FORM FIELDS ── */
    .field {
      margin-bottom: 14px;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dk);
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--gold-bdr);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 300;
      padding: 10px 12px;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }

    input[type="password"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 124, 0.07);
    }

    input::placeholder {
      color: var(--muted);
    }

    .msg {
      display: none;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      padding: 9px 12px;
      border-radius: var(--radius);
      margin-bottom: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .msg.error {
      display: block;
      background: rgba(201, 124, 124, 0.08);
      border: 1px solid rgba(201, 124, 124, 0.25);
      color: var(--error);
    }

    .msg.success {
      display: block;
      background: var(--gold-dim);
      border: 1px solid var(--gold-bdr);
      color: var(--gold-lt);
    }

    /* ── BUTTON ── */
    .btn {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      color: var(--gold);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color .3s;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: transform .35s cubic-bezier(.4, 0, .2, 1);
    }

    .btn:hover {
      color: var(--black);
    }

    .btn:hover::before {
      transform: translateX(0);
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn:disabled::before {
      display: none;
    }

    .btn:disabled {
      color: var(--gold);
    }

    /* ── HISTORY GRID ── */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .h-card {
      background: var(--card2);
      border: 1px solid var(--gold-bdr);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color .2s, transform .2s;
      cursor: pointer;
    }

    .h-card:hover {
      border-color: rgba(201, 168, 124, 0.55);
      transform: translateY(-2px);
    }

    .h-thumb {
      width: 100%;
      aspect-ratio: 9/16;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .h-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
    }

    .h-thumb-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--gold-bdr);
      border-radius: 2px;
      font-size: 0.5rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      padding: 2px 5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .h-info {
      padding: 10px 10px 8px;
    }

    .h-topic {
      font-size: 0.68rem;
      color: var(--text);
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .h-date {
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .h-actions {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    .h-btn {
      flex: 1;
      padding: 5px 4px;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: background .2s, color .2s;
    }

    .h-btn-play {
      background: var(--gold);
      color: var(--black);
      border: none;
    }

    .h-btn-play:hover {
      background: var(--gold-lt);
    }

    .h-btn-dl {
      background: transparent;
      border: 1px solid var(--gold-bdr);
      color: var(--gold-dk);
    }

    .h-btn-dl:hover {
      background: var(--gold-dim);
      color: var(--gold);
    }

    .h-empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .h-empty-icon {
      font-size: 1.8rem;
      opacity: 0.3;
      margin-bottom: 12px;
    }

    .h-empty-text {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      line-height: 1.7;
    }

    .h-empty-link {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 20px;
      border: 1px solid var(--gold-bdr);
      border-radius: var(--radius);
      color: var(--gold);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s;
    }

    .h-empty-link:hover {
      background: var(--gold-dim);
    }

    /* ── VIDEO MODAL ── */
    #video-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #video-modal.open {
      display: flex;
    }

    .modal-inner {
      position: relative;
      width: 100%;
      max-width: 360px;
    }

    .modal-close {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      transition: color .2s;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .modal-close:hover {
      color: var(--gold);
    }

    #modal-video {
      width: 100%;
      aspect-ratio: 9/16;
      border-radius: var(--radius);
      border: 1px solid var(--gold-bdr);
      background: #000;
      max-height: 80vh;
      object-fit: contain;
    }

    /* ── TOAST ── */
    #toast-wrap {
      position: fixed;
      top: 64px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: all;
      min-width: 270px;
      max-width: 340px;
      background: #0d0c0a;
      border: 1px solid var(--gold-bdr);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
      transform: translateX(110%);
      opacity: 0;
      transition: transform .45s cubic-bezier(.16, 1, .3, 1), opacity .4s;
    }

    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast.hide {
      transform: translateX(110%);
      opacity: 0;
    }

    .t-bar {
      height: 2px;
    }

    .t-bar.gold {
      background: linear-gradient(90deg, var(--gold-dk), var(--gold-lt));
    }

    .t-bar.red {
      background: linear-gradient(90deg, #8b3a3a, #c97c7c);
    }

    .t-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }

    .t-ico {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10px;
      flex-shrink: 0;
    }

    .t-ico.gold {
      background: var(--gold-dim);
      color: var(--gold-lt);
      border: 1px solid var(--gold-bdr);
    }

    .t-ico.red {
      background: rgba(201, 124, 124, 0.1);
      color: #c97c7c;
      border: 1px solid rgba(201, 124, 124, 0.2);
    }

    .t-txt .t-ttl {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .t-ttl.gold {
      color: var(--gold-lt);
    }

    .t-ttl.red {
      color: #c97c7c;
    }

    .t-sub {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 1px;
      font-weight: 300;
    }

    .t-prog {
      height: 2px;
      background: rgba(201, 168, 124, 0.07);
    }

    .t-prog-bar {
      height: 100%;
      transition: width linear;
    }

    .t-prog-bar.gold {
      background: var(--gold-dk);
    }

    .t-prog-bar.red {
      background: #8b3a3a;
    }
  </style>
</head>

<body>

  <div class="ambient a1"></div>
  <div class="ambient a2"></div>
  <div id="toast-wrap"></div>

  <!-- NAV -->
  <nav>
    <a href="/" class="nav-brand">StarFilm</a>
    <div class="nav-right">
      <a href="/generate" class="nav-btn">New Video</a>
      <button class="nav-btn danger" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>

  <!-- VIDEO MODAL -->
  <div id="video-modal">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal()">✕ &nbsp; Close</button>
      <video id="modal-video" controls playsinline></video>
    </div>
  </div>

  <div class="page">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div class="page-header-top">
        <div>
          <div class="page-title-label">My Account</div>
          <div class="page-title">Dashboard <span id="header-name"></span></div>
        </div>
      </div>
    </div>

    <!-- STATS ROW -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Videos</div>
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-sub">generated</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Member Since</div>
        <div class="stat-value" style="font-size:1.1rem;padding-top:6px;" id="stat-since">—</div>
        <div class="stat-sub">account created</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Status</div>
        <div class="stat-value" style="font-size:1rem;padding-top:6px;color:#a0c87c;">Active</div>
        <div class="stat-sub">account verified</div>
      </div>
    </div>

    <!-- ACCOUNT INFO + CHANGE PASSWORD -->
    <div class="two-col">

      <!-- Account Info -->
      <div class="panel">
        <div class="panel-title">Account Information</div>
        <div class="info-row">
          <div class="info-item">
            <div class="info-lbl">Full Name</div>
            <div class="info-val" id="info-name">—</div>
          </div>
          <div class="info-item">
            <div class="info-lbl">Email Address</div>
            <div class="info-val" id="info-email">—</div>
          </div>
          <div class="info-item">
            <div class="info-lbl">Member Since</div>
            <div class="info-val" id="info-since">—</div>
          </div>
          <div class="info-item">
            <div class="info-lbl">Account Status</div>
            <div class="info-val" style="color:#a0c87c;">Verified ✓</div>
          </div>
        </div>
      </div>

      <!-- Change Password -->
      <div class="panel">
        <div class="panel-title">Change Password</div>
        <div class="msg" id="pw-msg"></div>
        <div class="field">
          <label>Current Password</label>
          <input type="password" id="pw-current" placeholder="••••••••" />
        </div>
        <div class="field">
          <label>New Password <span style="color:var(--muted);font-size:.5rem">— min 6 chars</span></label>
          <input type="password" id="pw-new" placeholder="••••••••" />
        </div>
        <div class="field">
          <label>Confirm New Password</label>
          <input type="password" id="pw-confirm" placeholder="••••••••"
            onkeydown="if(event.key==='Enter') changePassword()" />
        </div>
        <button class="btn" id="pw-btn" onclick="changePassword()">
          <span>Update Password</span>
        </button>
      </div>

    </div>

    <!-- RECENT VIDEOS / HISTORY -->
    <div class="section-title">Production History</div>
    <div class="history-grid" id="history-grid">
      <div class="h-empty">
        <div class="h-empty-icon">◈</div>
        <div class="h-empty-text">Loading your productions...</div>
      </div>
    </div>

  </div><!-- /page -->

  <script>
    // ── TOAST ───────────────────────────────────────────────────
    function showToast(color, title, sub, duration = 4000) {
      const icons = { gold: '✦', red: '◇' };
      const wrap = document.getElementById('toast-wrap');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `
    <div class="t-bar ${color}"></div>
    <div class="t-inner">
      <div class="t-ico ${color}">${icons[color]}</div>
      <div class="t-txt">
        <div class="t-ttl ${color}">${title}</div>
        <div class="t-sub">${sub}</div>
      </div>
    </div>
    <div class="t-prog"><div class="t-prog-bar ${color}" style="width:100%"></div></div>
  `;
      wrap.appendChild(t);
      requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
      const bar = t.querySelector('.t-prog-bar');
      bar.style.transition = `width ${duration}ms linear`;
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
      setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 500); }, duration);
    }

    function showMsg(id, type, text) {
      const el = document.getElementById(id);
      el.className = `msg ${type}`;
      el.textContent = text;
    }

    // ── LOAD STATS ───────────────────────────────────────────────
    async function loadDashboard() {
      try {
        const resp = await fetch('/api/stats');
        if (resp.status === 401) { window.location.href = '/login'; return; }
        const d = await resp.json();

        // Header
        document.getElementById('header-name').textContent = d.name ? `— ${d.name}` : '';

        // Stats
        document.getElementById('stat-total').textContent = d.total_videos ?? 0;
        const sinceYear = d.member_since ? d.member_since.substring(0, 7) : '—';
        document.getElementById('stat-since').textContent = sinceYear;

        // Account info
        document.getElementById('info-name').textContent = d.name || '—';
        document.getElementById('info-email').textContent = d.email || '—';
        document.getElementById('info-since').textContent = d.member_since
          ? new Date(d.member_since).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
          : '—';

        // History grid
        renderHistory(d.recent || []);

      } catch (e) {
        console.error(e);
      }
    }

    function renderHistory(videos) {
      const grid = document.getElementById('history-grid');

      if (!videos.length) {
        grid.innerHTML = `
      <div class="h-empty">
        <div class="h-empty-icon">◈</div>
        <div class="h-empty-text">No productions yet.<br>Generate your first AI Short to see it here.</div>
        <a href="/generate" class="h-empty-link">Start Creating</a>
      </div>`;
        return;
      }

      grid.innerHTML = '';
      videos.forEach(v => {
        let dateStr = '—';
        if (v.created_at) {
          const date = new Date(v.created_at);

          const datePart = date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          });

          const timePart = date.toLocaleTimeString('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          });

          dateStr = `${datePart}, ${timePart} (UTC)`;
        }

        const card = document.createElement('div');
        card.className = 'h-card';
        card.innerHTML = `
      <div class="h-thumb" onclick="openModal('${v.video_url}')">
        <img src="${v.thumbnail_url || ''}" alt="${v.topic}"
             onerror="this.parentElement.style.background='#111008';this.style.display='none'">
        <div class="h-thumb-badge">Shorts</div>
      </div>
      <div class="h-info">
        <div class="h-topic">${v.topic || v.title || '—'}</div>
        <div class="h-date">${dateStr}</div>
        <div class="h-actions">
          <button class="h-btn h-btn-play" onclick="openModal('${v.video_url}')">▶ Play</button>
          <a class="h-btn h-btn-dl" href="/api/download/${v.job_id}" download>↓</a>
        </div>
      </div>
    `;
        grid.appendChild(card);
      });
    }

    // ── CHANGE PASSWORD ──────────────────────────────────────────
    async function changePassword() {
      const current = document.getElementById('pw-current').value;
      const newPw = document.getElementById('pw-new').value;
      const confirm = document.getElementById('pw-confirm').value;
      const btn = document.getElementById('pw-btn');

      if (!current || !newPw || !confirm) {
        showMsg('pw-msg', 'error', 'Please fill in all fields.');
        return;
      }
      if (newPw !== confirm) {
        showMsg('pw-msg', 'error', 'New passwords do not match.');
        return;
      }
      if (newPw.length < 6) {
        showMsg('pw-msg', 'error', 'Password must be at least 6 characters.');
        return;
      }

      btn.disabled = true;
      btn.querySelector('span').textContent = 'Updating...';
      showMsg('pw-msg', '', '');

      try {
        const resp = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password: current, new_password: newPw }),
        });
        const data = await resp.json();

        if (data.success) {
          showMsg('pw-msg', 'success', 'Password updated successfully.');
          showToast('gold', 'Password Updated', 'Your new password is now active.');
          document.getElementById('pw-current').value = '';
          document.getElementById('pw-new').value = '';
          document.getElementById('pw-confirm').value = '';
        } else {
          showMsg('pw-msg', 'error', data.error || 'Could not update password.');
          showToast('red', 'Update Failed', data.error || 'Please try again.');
        }
      } catch (e) {
        showMsg('pw-msg', 'error', 'Connection error. Please try again.');
      }

      btn.disabled = false;
      btn.querySelector('span').textContent = 'Update Password';
    }

    // ── VIDEO MODAL ──────────────────────────────────────────────
    function openModal(url) {
      const modal = document.getElementById('video-modal');
      const video = document.getElementById('modal-video');
      video.src = url + '?t=' + Date.now();
      modal.classList.add('open');
      video.play().catch(() => { });
    }
    function closeModal() {
      const modal = document.getElementById('video-modal');
      const video = document.getElementById('modal-video');
      video.pause();
      video.src = '';
      modal.classList.remove('open');
    }
    document.getElementById('video-modal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── LOGOUT ───────────────────────────────────────────────────
    async function doLogout() {
      await fetch('/api/logout', { method: 'POST' });
      showToast('gold', 'Signed Out', 'See you next time.');
      setTimeout(() => { window.location.href = '/login'; }, 1000);
    }

    // ── INIT ─────────────────────────────────────────────────────
    loadDashboard();
  </script>
</body>

</html>
