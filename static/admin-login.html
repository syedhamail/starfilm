<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — STARFILM</title>

<!-- FAVICON -->
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="icon" href="/static/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

<style>
    body {
        font-family: 'Montserrat', sans-serif;
        background: #000;
        color: #f0ead8;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .card {
        background: #161410;
        border: 1px solid #c9a87c33;
        border-radius: 8px;
        padding: 40px 36px;
        width: 100%;
        max-width: 380px;
    }
    h1 { color: #c9a87c; text-align: center; margin-bottom: 30px; font-family: 'Cormorant Garamond', serif; }
    input {
        width: 100%; padding: 12px; margin: 10px 0;
        background: #0a0907; border: 1px solid #c9a87c44;
        color: white; border-radius: 4px;
    }
    button {
        width: 100%; padding: 14px; margin-top: 20px;
        background: #c9a87c; color: black; border: none;
        font-weight: bold; font-size: 1rem; cursor: pointer;
        border-radius: 4px;
    }
    .error { color: #ff6666; text-align: center; margin-top: 10px; }
</style>
</head>
<body>

<div class="card">
    <h1>ADMIN LOGIN</h1>
    <div id="error" class="error"></div>
    
    <input type="email" id="email" placeholder="admin@starfilm.com" />
    <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter') login()" />
    
    <button onclick="login()">LOGIN</button>
</div>

<script>
async function login() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    const err = document.getElementById('error');

    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password: pass})
        });
        const data = await res.json();

        if (data.success) {
            window.location.href = '/admin/dashboard';
        } else {
            err.textContent = data.error || "Login failed";
        }
    } catch(e) {
        err.textContent = "Server error";
    }
}
</script>
</body>
</html>
