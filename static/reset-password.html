<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STARFILM — Reset Password</title>

<!-- FAVICON -->
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="icon" href="/static/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black:    #000000;
  --card:     #0e0d0b;
  --gold:     #c9a87c;
  --gold-lt:  #dfc49c;
  --gold-dk:  #a07d52;
  --gold-dim: rgba(201,168,124,0.10);
  --gold-bdr: rgba(201,168,124,0.20);
  --text:     #f0ead8;
  --muted:    #7a6e5a;
  --radius:   4px;
}
body {
  font-family: 'Montserrat', sans-serif;
  background: var(--black);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
body::after {
  content: '';
  position: fixed;
  width: 500px; height: 500px;
  background: var(--gold);
  border-radius: 50%;
  filter: blur(160px);
  opacity: 0.055;
  top: -150px; right: -150px;
  pointer-events: none;
}
.card {
  position: relative; z-index: 10;
  width: 100%; max-width: 400px;
  background: var(--card);
  border: 1px solid var(--gold-bdr);
  border-radius: var(--radius);
  padding: 40px 36px;
}
.card::before, .card::after {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  border-color: var(--gold-dk);
  border-style: solid;
}
.card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

.logo-wrap { text-align: center; margin-bottom: 28px; }
.brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem; font-weight: 700;
  letter-spacing: 0.22em; color: var(--gold);
  text-transform: uppercase; display: block;
}
.divider {
  width: 50px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dk), transparent);
  margin: 10px auto 0;
}
.page-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.7rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--gold-dk);
  margin-bottom: 24px; padding-bottom: 14px;
  border-bottom: 1px solid var(--gold-bdr);
}
label {
  display: block; font-size: 0.6rem;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold-dk); font-weight: 600; margin-bottom: 7px;
}
input {
  width: 100%;
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--gold-bdr);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.85rem; font-weight: 300;
  padding: 11px 14px; outline: none;
  transition: border-color .25s, box-shadow .25s;
}
input::placeholder { color: var(--muted); }
input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,124,0.07);
}
.field { margin-bottom: 18px; }
.msg {
  display: none; font-size: 0.68rem;
  letter-spacing: 0.06em; padding: 10px 14px;
  border-radius: var(--radius); margin-bottom: 18px;
  font-weight: 400; line-height: 1.5;
}
.msg.error   { display: block; background: rgba(201,124,124,0.08); border: 1px solid rgba(201,124,124,0.25); color: #c97c7c; }
.msg.success { display: block; background: var(--gold-dim); border: 1px solid var(--gold-bdr); color: var(--gold-lt); }

.btn {
  width: 100%; margin-top: 6px; padding: 13px;
  background: transparent; border: 1px solid var(--gold);
  border-radius: var(--radius); color: var(--gold);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.26em; text-transform: uppercase;
  cursor: pointer; position: relative; overflow: hidden;
  transition: color .3s;
}
.btn::before {
  content: ''; position: absolute; inset: 0;
  background: var(--gold);
  transform: translateX(-101%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.btn:hover { color: var(--black); }
.btn:hover::before { transform: translateX(0); }
.btn span { position: relative; z-index: 1; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { color: var(--gold); }
.btn:disabled::before { display: none; }

/* Toast */
#toast-wrap {
  position: fixed; top: 24px; right: 24px;
  z-index: 9999; display: flex; flex-direction: column;
  gap: 10px; pointer-events: none;
}
.toast {
  pointer-events: all; min-width: 280px; max-width: 360px;
  background: #0d0c0a; border: 1px solid var(--gold-bdr);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  transform: translateX(110%); opacity: 0;
  transition: transform .45s cubic-bezier(.16,1,.3,1), opacity .4s;
}
.toast.show { transform: translateX(0); opacity: 1; }
.toast.hide { transform: translateX(110%); opacity: 0; }
.t-bar { height: 2px; }
.t-bar.gold { background: linear-gradient(90deg, var(--gold-dk), var(--gold-lt)); }
.t-bar.red  { background: linear-gradient(90deg, #8b3a3a, #c97c7c); }
.t-inner { display: flex; align-items: center; gap: 10px; padding: 13px 14px; }
.t-ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; flex-shrink: 0; }
.t-ico.gold { background: var(--gold-dim); color: var(--gold-lt); border: 1px solid var(--gold-bdr); }
.t-ico.red  { background: rgba(201,124,124,0.1); color: #c97c7c; border: 1px solid rgba(201,124,124,0.2); }
.t-ttl { font-family: 'Cormorant Garamond', serif; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; }
.t-ttl.gold { color: var(--gold-lt); }
.t-ttl.red  { color: #c97c7c; }
.t-sub { font-size: 0.65rem; color: var(--muted); margin-top: 2px; font-weight: 300; }
.t-prog { height: 2px; background: rgba(201,168,124,0.07); }
.t-prog-bar { height: 100%; transition: width linear; }
.t-prog-bar.gold { background: var(--gold-dk); }
.t-prog-bar.red  { background: #8b3a3a; }
</style>
</head>
<body>

<div id="toast-wrap"></div>

<div class="card">
  <div class="logo-wrap">
    <svg width="36" height="36" viewBox="0 0 80 80" fill="none" style="margin-bottom:10px;opacity:.9">
      <circle cx="28" cy="22" r="11" stroke="#c9a87c" stroke-width="3"/>
      <circle cx="28" cy="22" r="4"  stroke="#c9a87c" stroke-width="2.5"/>
      <circle cx="52" cy="18" r="8"  stroke="#c9a87c" stroke-width="3"/>
      <circle cx="52" cy="18" r="3"  stroke="#c9a87c" stroke-width="2"/>
      <rect x="18" y="32" width="38" height="22" rx="3" stroke="#c9a87c" stroke-width="3"/>
      <rect x="8"  y="36" width="10" height="6" rx="2" stroke="#c9a87c" stroke-width="2.5"/>
      <path d="M56 36 L66 32 L66 46 L56 42 Z" stroke="#c9a87c" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="37" y1="54" x2="28" y2="70" stroke="#c9a87c" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="37" y1="54" x2="46" y2="70" stroke="#c9a87c" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="37" y1="54" x2="37" y2="70" stroke="#c9a87c" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span class="brand">StarFilm</span>
    <div class="divider"></div>
  </div>

  <div class="page-title">Set New Password</div>

  <div class="msg" id="reset-msg"></div>

  <div class="field">
    <label>New Password <span style="color:var(--muted);font-size:.55rem">— min 6 characters</span></label>
    <input type="password" id="reset-pass" placeholder="••••••••" />
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <input type="password" id="reset-confirm" placeholder="••••••••"
           onkeydown="if(event.key==='Enter') doReset()" />
  </div>

  <button class="btn" id="reset-btn" onclick="doReset()">
    <span>Update Password</span>
  </button>
</div>

<script>
// Get token from URL
const token = new URLSearchParams(window.location.search).get('token');
if (!token) { window.location.href = '/login'; }

function showToast(color, title, sub, duration = 4500) {
  const icons = { gold: '✦', red: '◇' };
  const wrap  = document.getElementById('toast-wrap');
  const t     = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `
    <div class="t-bar ${color}"></div>
    <div class="t-inner">
      <div class="t-ico ${color}">${icons[color]}</div>
      <div>
        <div class="t-ttl ${color}">${title}</div>
        <div class="t-sub">${sub}</div>
      </div>
    </div>
    <div class="t-prog"><div class="t-prog-bar ${color}" style="width:100%"></div></div>
  `;
  wrap.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  const bar = t.querySelector('.t-prog-bar');
  bar.style.transition = `width ${duration}ms linear`;
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 500); }, duration);
}

function showMsg(type, text) {
  const el = document.getElementById('reset-msg');
  el.className = `msg ${type}`;
  el.textContent = text;
}

async function doReset() {
  const pass    = document.getElementById('reset-pass').value;
  const confirm = document.getElementById('reset-confirm').value;
  const btn     = document.getElementById('reset-btn');

  if (!pass || !confirm) { showMsg('error', 'Please fill in both fields.'); return; }
  if (pass !== confirm)  { showMsg('error', 'Passwords do not match.'); return; }
  if (pass.length < 6)   { showMsg('error', 'Password must be at least 6 characters.'); return; }

  btn.disabled = true;
  btn.querySelector('span').textContent = 'Updating...';

  try {
    const resp = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pass }),
    });
    const data = await resp.json();

    if (data.success) {
      showToast('gold', 'Password Updated', 'Redirecting to sign in...');
      setTimeout(() => { window.location.href = '/login?msg=reset_done'; }, 1500);
    } else {
      showMsg('error', data.error || 'Could not reset password. Link may have expired.');
      showToast('red', 'Reset Failed', data.error || 'Please request a new reset link.');
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Update Password';
    }
  } catch(e) {
    showMsg('error', 'Connection error. Please try again.');
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Update Password';
  }
}
</script>
</body>
</html>
